<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>2048 Activity</title>
    <script type="module" crossorigin src="/assets/index-CkQq_ske.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DXYwg-IC.css">
  </head>
  <body>
    <div id="app" class="app-shell">
      <main class="game-page">
        <header class="topbar">
          <h1 class="title">2048</h1>
          <div class="score-group">
            <div class="score-card">
              <span class="score-label">SCORE</span>
              <span id="score" class="score-value">0</span>
            </div>
            <div class="score-card">
              <span class="score-label">BEST</span>
              <span id="best-score" class="score-value">0</span>
            </div>
          </div>
        </header>

        <section class="toolbar">
          <p id="status" class="status-pill">연결 대기 중...</p>
          <div class="toolbar-actions">
            <button id="rank-btn" class="btn btn-secondary" type="button">🏆</button>
            <button id="theme-btn" class="btn btn-secondary" type="button">🌓</button>
            <button id="new-game-btn" class="btn btn-primary" type="button">새 게임</button>
            <button id="undo-btn" class="btn btn-secondary" type="button">되돌리기</button>
          </div>
        </section>

        <section class="board-section">
          <div class="board-wrapper">
            <div id="board" class="board" aria-label="2048 board"></div>

            <div id="overlay" class="overlay hidden">
              <div class="overlay-card">
                <h2 id="overlay-title">게임 종료</h2>
                <p id="overlay-text">새 게임을 시작해보세요.</p>
                <div class="overlay-actions">
                  <button id="overlay-continue-btn" class="btn btn-secondary" type="button">계속하기</button>
                  <button id="overlay-restart-btn" class="btn btn-primary" type="button">새 게임</button>
                </div>
              </div>
            </div>

            <div id="rank-overlay" class="overlay hidden">
              <div class="rank-card">
                <div class="rank-header">
                  <h2>🏆 클랜 랭킹 TOP 10</h2>
                  <button id="rank-close-btn" type="button">✕</button>
                </div>
                <div id="rank-list" class="rank-list">
                  </div>
              </div>
            </div>

          </div>
        </section>
      </main>
    </div>
  </body>
</html>
